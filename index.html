<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Board</title>
    <style>

        * {
            box-sizing: border-box;
        }

        section {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            margin-top: 8%;
        }

        .btn {
            background-color: rebeccapurple;
            border-radius: 5px;
            border: none;
            color: #fff;
            margin: 1rem;
            padding: 1.5rem 3rem;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:focus {
            outline: none;
        }
    </style>
</head>
<body>
<audio id="applause" src="sounds/applause.mp3"></audio>
<audio id="boo" src="sounds/boo.mp3"></audio>
<audio id="gasp" src="sounds/gasp.mp3"></audio>
<audio id="tada" src="sounds/tada.mp3"></audio>
<audio id="victory" src="sounds/victory.mp3"></audio>
<audio id="wrong" src="sounds/wrong.mp3"></audio>
<audio id="B" src="sounds/wrong.mp3"></audio>

<section>
<h1>Spielkiste St. Martin 2025</h1></section>

<section>

    <div id="buttons"></div>
</section>
<section>

    <div id="buttons"></div>
</section>
    <script>
        const sounds = ['applause', 'boo', 'gasp', 'tada', 'victory', 'wrong']

        Bild 1 - Pferd Galopp
        Bild 2 - Pferd schnauben
        Bild 2 - Pferd wiehern
        Bild 2 - Winter Wind
        Bild 3 - Kirchturmuhr laeutet
        Bild 3 - Kirchturmuhr schlaegt 6
        Bild 3 - Kirchturmuhr schlaegt oft
        Bild 3 - Stadt Winter
        Bild 4 - Pferd Galopp langsamer
        Bild 4 - Winter stuermischer Wind
        Bild 5 - Klopfen 1
        Bild 5 - Klopfen 2
        Bild 5 - Klopfen 3
        Bild 7 - Mantel add-on.M
        Bild 7 - Mantel Bewegung
        Bild 7 - Mantel zerteilen
        Bild 7 - Schwert zuecken
        Raben
        sounds.forEach(sound => {
            const btn = document.createElement('button')
            btn.classList.add('btn')

            btn.innerText = sound

            btn.addEventListener('click', () => {
                stopSongs()

                document.getElementById(sound).play()
            })

            document.getElementById('buttons').appendChild(btn)
        })

        function stopSongs() {
            sounds.forEach(sound => {
                const song = document.getElementById(sound)

                song.pause()
                song.currentTime = 0;
            })
        }
    </script>
</body>
</html>
