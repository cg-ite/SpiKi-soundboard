<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Board</title>
    <style>

        * {
            box-sizing: border-box;
        }

        section {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            margin-top: 8%;
        }

        .btn {
            background-color: rebeccapurple;
            border-radius: 5px;
            border: none;
            color: #fff;
            margin: 1rem;
            padding: 1.5rem 3rem;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:focus {
            outline: none;
        }
    </style>
</head>
<body>
<audio id="Bild_1_-_Pferd_Galopp" src="sounds/Bild_1_-_Pferd_Galopp.mp3"></audio>
<audio id="Bild_2_-_Pferd_schnauben" src="sounds/Bild_2_-_Pferd_schnauben.mp3"></audio>
<audio id="Bild_2_-_Pferd_wiehern" src="sounds/Bild_2_-_Pferd_wiehern.mp3"></audio>
<audio id="Bild_2_-_Winter_Wind" src="sounds/Bild_2_-_Winter_Wind.mp3"></audio>
<audio id="Bild_3_-_Kirchturmuhr_laeutet" src="sounds/Bild_3_-_Kirchturmuhr_laeutet.mp3"></audio>
<audio id="Bild_3_-_Kirchturmuhr_schlaegt_6" src="sounds/Bild_3_-_Kirchturmuhr_schlaegt_6.mp3"></audio>
<audio id="Bild_3_-_Kirchturmuhr_schlaegt_oft" src="sounds/Bild_3_-_Kirchturmuhr_schlaegt_oft.mp3"></audio>
<audio id="Bild_3_-_Stadt_Winter" src="sounds/Bild_3_-_Stadt_Winter.mp3"></audio>
<audio id="Bild_4_-_Pferd_Galopp_langsamer" src="sounds/Bild_4_-_Pferd_Galopp_langsamer.mp3"></audio>
<audio id="Bild_4_-_Winter_stuermischer_Wind" src="sounds/Bild_4_-_Winter_stuermischer_Wind.mp3"></audio>
<audio id="Bild_5_-_Klopfen_1" src="sounds/Bild_5_-_Klopfen_1.mp3"></audio>
<audio id="Bild_5_-_Klopfen_2" src="sounds/Bild_5_-_Klopfen_2.mp3"></audio>
<audio id="Bild_5_-_Klopfen_3" src="sounds/Bild_5_-_Klopfen_3.mp3"></audio>
<audio id="Bild_7_-_Mantel_add-on_M" src="sounds/Bild_7_-_Mantel_add-on_M.mp3"></audio>
<audio id="Bild_7_-_Mantel_Bewegung" src="sounds/Bild_7_-_Mantel_Bewegung.mp3"></audio>
<audio id="Bild_7_-_Mantel_zerteilen" src="sounds/Bild_7_-_Mantel_zerteilen.mp3"></audio>
<audio id="Bild_7_-_Schwert_zuecken" src="sounds/Bild_7_-_Schwert_zuecken.mp3"></audio>
<audio id="Raben" src="sounds/Raben.mp3"></audio>

<section>
<h1>Spielkiste St. Martin 2025</h1></section>

<section>

    <div id="buttons"></div>
</section>

    <script>
      const sounds = [
        "Bild_1_-_Pferd_Galopp",
        "Bild_2_-_Pferd_schnauben",
        "Bild_2_-_Pferd_wiehern",
        "Bild_2_-_Winter_Wind",
        "Bild_3_-_Kirchturmuhr_laeutet",
        "Bild_3_-_Kirchturmuhr_schlaegt_6",
        "Bild_3_-_Kirchturmuhr_schlaegt_oft",
        "Bild_3_-_Stadt_Winter",
        "Bild_4_-_Pferd_Galopp_langsamer",
        "Bild_4_-_Winter_stuermischer_Wind",
        "Bild_5_-_Klopfen_1",
        "Bild_5_-_Klopfen_2",
        "Bild_5_-_Klopfen_3",
        "Bild_7_-_Mantel_add-on_M",
        "Bild_7_-_Mantel_Bewegung",
        "Bild_7_-_Mantel_zerteilen",
        "Bild_7_-_Schwert_zuecken",
        "Raben"
      ];


      sounds.forEach(sound => {
            const btn = document.createElement('button')
            btn.classList.add('btn')

            btn.innerText = sound

            btn.addEventListener('click', () => {
                stopSongs()

                document.getElementById(sound).play()
            })

            document.getElementById('buttons').appendChild(btn)
        })

        function stopSongs() {
            sounds.forEach(sound => {
                const song = document.getElementById(sound)

                song.pause()
                song.currentTime = 0;
            })
        }
    </script>
</body>
</html>
